# Minimal production LiveKit config for a single VM.
# Keys come from the LIVEKIT_KEYS env var set in docker-compose.yml.
port: 7880
bind_addresses: ["0.0.0.0"]
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50200
  use_external_ip: true
turn:
  # Built-in TURN lets players behind strict NATs/firewalls connect.
  enabled: true
  domain: turn.example.com # set to a DNS name pointing at this host
  tls_port: 5349
  udp_port: 3478
  external_tls: false
room:
  empty_timeout: 60
  max_participants: 12
logging:
  level: info
